  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191b20;
      --panel2: #20232a;
      --text: #f4f5f7;
      --muted: #a8adb7;
      --line: #343840;
      --accent: #f2f2f2;
      --accent-text: #111216;
      --lucky: #f4d35e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(920px, 92vw);
      margin: 0 auto;
      padding: 40px 0 64px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 7vw, 4.2rem);
      letter-spacing: .04em;
    }

    .subtitle {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .all-patterns-link {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: .92rem;
    }

    .all-patterns-link a {
      color: var(--text);
      text-underline-offset: 3px;
    }

    .all-patterns-link a:hover {
      opacity: .8;
    }

    .summary {
      display: grid;
      grid-template-columns: 1.6fr .9fr 1.5fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-card {
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      text-align: left;
    }

    .summary-label {
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .06em;
      margin-bottom: 5px;
    }

    .summary-main {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .summary-sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: .82rem;
    }

    .lucky-inline {
      color: var(--lucky);
      white-space: nowrap;
    }

    .encounter-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel2);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width .25s ease;
    }

    .progress-text {
      color: var(--muted);
      font-size: .76rem;
      white-space: nowrap;
    }

    .controls {
      margin: 18px 0;
    }

    .controls-title {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .9rem;
    }

    .hands {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      max-width: 620px;
      margin: 0 auto;
    }

    .charm-control {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .charm-toggle {
      min-width: 128px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .charm-toggle.on {
      background: rgba(244, 211, 94, .12);
      border-color: var(--lucky);
      color: var(--lucky);
    }

    .charm-toggle:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .hand-button {
      padding: 18px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
      cursor: pointer;
    }

    .hand-button:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .hand-button:disabled {
      opacity: .4;
      cursor: wait;
    }

    .stage {
      display: grid;
      place-items: center;
      min-height: 320px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
    }

    #idlePanel {
      padding: 34px 22px;
    }

    #playerWrap {
      display: none;
      width: 100%;
    }

    #displayPlayer {
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    #status {
      margin: 0;
      color: var(--muted);
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 22px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      transition: border-color .2s ease, background .2s ease;
    }

    .result.result-win {
      border-color: #5f8f6c;
    }

    .result.result-lose {
      border-color: #8e5f66;
    }

    .result.result-draw {
      border-color: #697487;
    }

    .result.result-lucky {
      border-color: #9c8430;
    }

    .result-main {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 800;
      letter-spacing: .04em;
      animation: result-pop .22s ease-out;
    }

    .result-main.win {
      color: #9fd7ad;
    }

    .result-main.lose {
      color: #dba5ad;
    }

    .result-main.draw {
      color: #c6ccd8;
    }

    .result-main.lucky {
      color: var(--lucky);
      animation: lucky-pop .55s ease-out;
    }

    .result.result-lucky {
      animation: lucky-flash .75s ease-out;
    }

    @keyframes lucky-pop {
      0% {
        opacity: .4;
        transform: scale(.82);
      }
      55% {
        opacity: 1;
        transform: scale(1.12);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes lucky-flash {
      0% {
        background: var(--panel);
        border-color: #9c8430;
      }
      35% {
        background: rgba(244, 211, 94, .16);
        border-color: var(--lucky);
      }
      100% {
        background: var(--panel);
        border-color: #9c8430;
      }
    }

    .result-detail {
      margin-top: 8px;
      color: var(--muted);
    }

    .charm-used {
      margin-top: 8px;
      color: var(--lucky);
      font-weight: 700;
    }

    .share-button {
      margin-top: 14px;
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: .88rem;
      cursor: pointer;
    }

    .share-button:hover {
      border-color: var(--text);
    }

    @keyframes result-pop {
      from {
        opacity: .5;
        transform: scale(.97);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .footer {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .small-button {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .contact-link {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: .82rem;
    }

    .contact-link a {
      color: var(--muted);
      text-underline-offset: 2px;
    }

    .contact-link a:hover {
      color: var(--text);
    }

    .special-thanks {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: .72rem;
    }

    .special-thanks a {
      color: var(--muted);
      text-underline-offset: 2px;
    }

    .special-thanks a:hover {
      color: var(--text);
    }

    .load-detail {
      margin-top: 10px;
      color: var(--muted);
      font-size: .8rem;
    }

    /* YouTube IFrame Player APIの最小表示サイズ要件を満たしたまま画面外へ退避 */
    .playlist-loader {
      position: absolute;
      left: -10000px;
      top: -10000px;
      width: 200px;
      height: 200px;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
    }

    @media (max-width: 650px) {
      main {
        padding-top: 28px;
      }

      .summary {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .summary-card {
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: center;
        gap: 8px 12px;
        padding: 10px 12px;
      }

      .summary-label {
        margin: 0;
      }

      .summary-main {
        font-size: 1rem;
      }

      .summary-sub {
        grid-column: 2;
        margin-top: -5px;
      }

      .summary-card:last-child {
        display: block;
      }

      .stage {
        min-height: 240px;
      }

      .hands {
        gap: 7px;
      }

      .hand-button {
        padding: 15px 5px;
      }
    }
  </style>
<script type="text/javascript" nonce="3a03b2d71a8f4e13bbb262530b6" src="//local.adguard.org?ts=1786851321666&amp;type=content-script&amp;dmn=chatgpt.com&amp;url=https%3A%2F%2Fchatgpt.com%2Fbackend-api%2Festuary%2Fcontent%3Fid%3Dfile_000000006e308206b7ddd5be0939f21d%26fn%3Dindex_ogp_preview.html%26cd%3Dattachment%26ts%3D496348%26p%3Dfs%26cid%3D1%26sig%3De219c1e08a7d817738adb31ce1cfda566896afa1ee54d496e042d6346e0d84c6%26v%3D0&amp;app=msedge.exe&amp;css=2&amp;js=1&amp;rel=0&amp;rji=0&amp;sbe=1"></script></head>

<body>
  <main>
    <h1>剣持じゃんけん</h1>

    <section class="summary" aria-label="戦績と進捗">

  <!-- 再生リスト取得専用。表示用プレイヤーとは完全に分離。 -->
  <div class="playlist-loader"><div id="loaderG"></div></div>
  <div class="playlist-loader"><div id="loaderC"></div></div>
  <div class="playlist-loader"><div id="loaderP"></div></div>
  <div class="playlist-loader"><div id="loaderL"></div></div>

  <script>
    const PLAYLISTS = {
      G: "PLDE7S7RlkaqQ",
      C: "PLSEWArLmE528",
      P: "PLLoF-mptrv8Q",
      L: "PLNINXcEYzdDA"
    };

    const EXPECTED_COUNTS = { G: 33, C: 33, P: 33, L: 9 };
    const EXPECTED_TOTAL = 108;

    const HAND_NAMES = {
      G: "グー",
      C: "チョキ",
      P: "パー"
    };

    const STORAGE_KEY = "kenmochi-janken-v1";

    let displayPlayer = null;
    let displayReady = false;

    const loaders = {};
    const loadedLists = {
      G: [],
      C: [],
      P: [],
      L: []
    };

    let catalog = [];
    let currentDraw = null;
    let isPlaying = false;
    let completedAllPatternsThisRound = false;
    let lastResultForShare = "";

    let state = loadState();
    if (state.charmCount <= 0) {
      state.charmEnabled = false;
    }

    const handButtons = [...document.querySelectorAll(".hand-button")];
    const statusEl = document.getElementById("status");
    const loadDetailEl = document.getElementById("loadDetail");
    const idlePanel = document.getElementById("idlePanel");
    const playerWrap = document.getElementById("playerWrap");
    const resultPanel = document.getElementById("resultPanel");
    const resultMain = document.getElementById("resultMain");
    const resultDetail = document.getElementById("resultDetail");
    const shareButton = document.getElementById("shareButton");

    const winStat = document.getElementById("winStat");
    const loseStat = document.getElementById("loseStat");
    const drawStat = document.getElementById("drawStat");
    const luckyStat = document.getElementById("luckyStat");
    const streakStat = document.getElementById("streakStat");
    const bestStreakStat = document.getElementById("bestStreakStat");
    const charmToggle = document.getElementById("charmToggle");
    const charmCountText = document.getElementById("charmCountText");
    const charmUsedMessage = document.getElementById("charmUsedMessage");
    const seenStat = document.getElementById("seenStat");
    const encounterBar = document.getElementById("encounterBar");
    const encounterProgressText = document.getElementById("encounterProgressText");
    const resetButton = document.getElementById("resetButton");

    function defaultState() {
      return {
        win: 0,
        lose: 0,
        draw: 0,
        lucky: 0,
        streak: 0,
        bestStreak: 0,
        charmCount: 2,
        charmEnabled: false,
        seenIds: []
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();

        const parsed = JSON.parse(raw);
        return {
          win: Number(parsed.win) || 0,
          lose: Number(parsed.lose) || 0,
          draw: Number(parsed.draw) || 0,
          lucky: Number(parsed.lucky) || 0,
          streak: Number(parsed.streak) || 0,
          bestStreak: Number(parsed.bestStreak) || 0,
          charmCount: Math.max(0, Math.min(2, Number(parsed.charmCount) || 0)),
          charmEnabled: Boolean(parsed.charmEnabled),
          seenIds: Array.isArray(parsed.seenIds) ? parsed.seenIds : []
        };
      } catch (e) {
        return defaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("localStorage save failed:", e);
      }
    }

    function updateStats() {
      const total = catalog.length || 108;
      const seen = state.seenIds.length;
      const percent = total > 0 ? Math.min(100, (seen / total) * 100) : 0;

      winStat.textContent = state.win;
      loseStat.textContent = state.lose;
      drawStat.textContent = state.draw;
      luckyStat.textContent = state.lucky;
      streakStat.textContent = state.streak;
      bestStreakStat.textContent = state.bestStreak;
      charmCountText.textContent = `${state.charmCount} / 2`;
      seenStat.textContent = `${seen} / ${total}`;

      if (state.charmCount <= 0) {
        state.charmEnabled = false;
      }

      charmToggle.textContent = state.charmEnabled ? "ON" : "OFF";
      charmToggle.classList.toggle("on", state.charmEnabled);
      charmToggle.disabled = state.charmCount <= 0 || isPlaying;

      encounterBar.style.width = `${percent}%`;
      encounterProgressText.textContent = `${percent.toFixed(1)}%`;
    }

    function updateLoadDetail() {
      loadDetailEl.textContent =
        `G ${loadedLists.G.length}/${EXPECTED_COUNTS.G} / ` +
        `C ${loadedLists.C.length}/${EXPECTED_COUNTS.C} / ` +
        `P ${loadedLists.P.length}/${EXPECTED_COUNTS.P} / ` +
        `L ${loadedLists.L.length}/${EXPECTED_COUNTS.L}`;
    }

    function setHandsEnabled(enabled) {
      handButtons.forEach(button => {
        button.disabled = !enabled;
      });

      charmToggle.disabled = !enabled || state.charmCount <= 0;
    }

    const apiScript = document.createElement("script");
    apiScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(apiScript);

    window.onYouTubeIframeAPIReady = function () {
      createPlaylistLoader("G", "loaderG");
      createPlaylistLoader("C", "loaderC");
      createPlaylistLoader("P", "loaderP");
      createPlaylistLoader("L", "loaderL");

      displayPlayer = new YT.Player("displayPlayer", {
        width: "100%",
        height: "100%",
        playerVars: {
          autoplay: 0,
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: () => {
            displayReady = true;
            tryFinishLoading();
          },
          onStateChange: onDisplayStateChange,
          onError: onDisplayError
        }
      });
    };

    function createPlaylistLoader(type, elementId) {
      loaders[type] = new YT.Player(elementId, {
        width: "200",
        height: "200",
        playerVars: {
          autoplay: 0,
          controls: 0,
          playsinline: 1
        },
        events: {
          onReady: () => {
            loaders[type].cuePlaylist({
              listType: "playlist",
              list: PLAYLISTS[type],
              index: 0
            });
            waitForPlaylist(type);
          },
          onError: event => {
            console.error(`Playlist ${type} error:`, event.data);
            statusEl.textContent =
              `${type}再生リストの読み込みでエラーが発生しました。`;
          }
        }
      });
    }

    function waitForPlaylist(type, attempt = 0) {
      const player = loaders[type];
      const list = player && player.getPlaylist ? player.getPlaylist() : [];

      if (Array.isArray(list) && list.length > 0) {
        loadedLists[type] = [...list];

        try {
          player.stopVideo();
        } catch (e) {}

        updateLoadDetail();
        tryFinishLoading();
        return;
      }

      if (attempt >= 50) {
        statusEl.textContent =
          `${type}再生リストを読み込めませんでした。公開設定・埋め込み設定を確認してください。`;
        return;
      }

      setTimeout(() => waitForPlaylist(type, attempt + 1), 300);
    }

    function tryFinishLoading() {
      const allListsReady =
        loadedLists.G.length > 0 &&
        loadedLists.C.length > 0 &&
        loadedLists.P.length > 0 &&
        loadedLists.L.length > 0;

      if (!allListsReady || !displayReady) return;

      catalog = [
        ...loadedLists.G.map(videoId => ({ videoId, type: "G" })),
        ...loadedLists.C.map(videoId => ({ videoId, type: "C" })),
        ...loadedLists.P.map(videoId => ({ videoId, type: "P" })),
        ...loadedLists.L.map(videoId => ({ videoId, type: "L" }))
      ];

      const currentIds = new Set(catalog.map(item => item.videoId));
      state.seenIds = [...new Set(state.seenIds)].filter(id => currentIds.has(id));
      saveState();

      const countsCorrect =
        loadedLists.G.length === EXPECTED_COUNTS.G &&
        loadedLists.C.length === EXPECTED_COUNTS.C &&
        loadedLists.P.length === EXPECTED_COUNTS.P &&
        loadedLists.L.length === EXPECTED_COUNTS.L;

      const noDuplicates = currentIds.size === catalog.length;
      const totalCorrect = catalog.length === EXPECTED_TOTAL;

      if (countsCorrect && totalCorrect && noDuplicates) {
        statusEl.textContent =
          "108本すべて読み込みました。あなたの手を選んでください。";
      } else {
        const notes = [];
        if (!countsCorrect || !totalCorrect) {
          notes.push(`本数 ${catalog.length}/108`);
        }
        if (!noDuplicates) {
          notes.push(`重複 ${catalog.length - currentIds.size}件`);
        }
        statusEl.textContent =
          `読み込み完了（要確認：${notes.join(" / ")}）。動作テストは可能です。`;
      }

      updateStats();
      updateLoadDetail();
      setHandsEnabled(catalog.length > 0);
    }

    function getAvailableItems() {
      const seen = new Set(state.seenIds);
      return catalog.filter(item => !seen.has(item.videoId));
    }

    function drawRandomItem() {
      let available = getAvailableItems();

      if (available.length === 0 && catalog.length > 0) {
        // 全動画を見たら、次の抽選から新しい一周を開始。
        state.seenIds = [];
        saveState();
        available = [...catalog];
        statusEl.textContent = "108本すべて遭遇しました。新しい一周を開始します。";
      }

      if (available.length === 0) return null;

      const index = Math.floor(Math.random() * available.length);
      return available[index];
    }

    function judge(userHand, kenmochiHand) {
      if (userHand === kenmochiHand) return "DRAW";

      if (
        (userHand === "G" && kenmochiHand === "C") ||
        (userHand === "C" && kenmochiHand === "P") ||
        (userHand === "P" && kenmochiHand === "G")
      ) {
        return "WIN";
      }

      return "LOSE";
    }

    function startRound(userHand) {
      if (!displayReady || catalog.length === 0 || isPlaying) return;

      completedAllPatternsThisRound = false;

      const item = drawRandomItem();
      if (!item) return;

      currentDraw = {
        userHand,
        item
      };

      // 抽選された時点で「遭遇済み」とする。
      state.seenIds.push(item.videoId);

      if (
        catalog.length > 0 &&
        state.seenIds.length === catalog.length
      ) {
        completedAllPatternsThisRound = true;
      }

      saveState();
      updateStats();

      isPlaying = true;
      setHandsEnabled(false);

      resultPanel.style.display = "none";
      resultPanel.className = "result";
      resultMain.className = "result-main";
      resultMain.textContent = "";
      resultDetail.textContent = "";
      charmUsedMessage.textContent = "";

      idlePanel.style.display = "none";
      playerWrap.style.display = "block";

      displayPlayer.loadVideoById({
        videoId: item.videoId
      });
    }

    function onDisplayStateChange(event) {
      if (event.data !== YT.PlayerState.ENDED || !currentDraw) return;

      try {
        displayPlayer.stopVideo();
      } catch (e) {}

      finishRound();
    }

    function finishRound() {
      const { userHand, item } = currentDraw;

      if (item.type === "L") {
        state.lucky += 1;

        const beforeCharm = state.charmCount;
        state.charmCount = Math.min(2, state.charmCount + 1);

        lastResultForShare = "LUCKY!";
        resultPanel.className = "result result-lucky";
        resultMain.textContent = "LUCKY!";
        resultMain.className = "result-main lucky";

        if (beforeCharm < 2) {
          resultDetail.textContent =
            `連勝お守りを1個獲得！ 所持 ${state.charmCount}/2`;
        } else {
          resultDetail.textContent =
            "連勝お守りは満タンです。勝敗には加算されません。";
        }
      } else {
        const result = judge(userHand, item.type);

        if (result === "WIN") {
          state.win += 1;
          state.streak += 1;
          state.bestStreak = Math.max(state.bestStreak, state.streak);
        }

        if (result === "LOSE") {
          state.lose += 1;

          if (state.charmEnabled && state.charmCount > 0) {
            state.charmCount -= 1;
            charmUsedMessage.textContent =
              "連勝お守りを使用！連勝記録を維持しました。";

            if (state.charmCount <= 0) {
              state.charmEnabled = false;
            }
          } else {
            state.streak = 0;
          }
        }

        if (result === "DRAW") {
          state.draw += 1;
          // DRAWでは連勝数を維持
        }

        lastResultForShare = result;
        resultPanel.className = `result result-${result.toLowerCase()}`;
        resultMain.textContent = result;
        resultMain.className = `result-main ${result.toLowerCase()}`;
        resultDetail.textContent =
          `あなた：${HAND_NAMES[userHand]}　／　剣持：${HAND_NAMES[item.type]}`;
      }

      saveState();
      updateStats();

      resultPanel.style.display = "block";

      if (completedAllPatternsThisRound) {
        statusEl.textContent = "全パターン遭遇！時間は大切にしよう！";
      } else {
        statusEl.textContent = "次の手を選んでください。";
      }

      isPlaying = false;
      currentDraw = null;
      setHandsEnabled(true);
    }

    function shareResultToX() {
      if (!lastResultForShare) return;

      const total = catalog.length || 108;
      const text =
        `剣持じゃんけん\n` +
        `戦績 ${state.win}勝${state.lose}敗${state.draw}分 / LUCKY ${state.lucky}\n` +
        `連勝 ${state.streak}（BEST ${state.bestStreak}） / 遭遇 ${state.seenIds.length}/${total}`;

      const shareUrl =
        "https://x.com/intent/tweet" +
        `?text=${encodeURIComponent(text)}` +
        `&url=${encodeURIComponent(window.location.href)}`;

      window.open(
        shareUrl,
        "x-share",
        "width=620,height=520,scrollbars=yes,resizable=yes"
      );
    }

    function onDisplayError(event) {
      console.error("Display player error:", event.data);

      statusEl.textContent =
        "動画を埋め込み再生できませんでした。別の手を選んでもう一度お試しください。";

      try {
        displayPlayer.stopVideo();
      } catch (e) {}

      isPlaying = false;
      currentDraw = null;
      setHandsEnabled(true);
    }

    handButtons.forEach(button => {
      button.addEventListener("click", () => {
        startRound(button.dataset.hand);
      });
    });

    shareButton.addEventListener("click", shareResultToX);

    charmToggle.addEventListener("click", () => {
      if (state.charmCount <= 0 || isPlaying) return;

      state.charmEnabled = !state.charmEnabled;
      saveState();
      updateStats();
    });

    resetButton.addEventListener("click", () => {
      const ok = window.confirm(
        "WIN / LOSE / DRAW / LUCKY / 連勝記録 / 連勝お守り と遭遇履歴をすべてリセットしますか？"
      );

      if (!ok) return;

      state = defaultState();
      saveState();
      updateStats();

      resultPanel.style.display = "none";
      statusEl.textContent =
        catalog.length > 0
          ? "記録をリセットしました。あなたの手を選んでください。"
          : "108本の動画を読み込んでいます…";
    });

    updateStats();
    updateLoadDetail();
  </script>
</body>
</html>
