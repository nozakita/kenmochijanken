<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>剣持じゃんけん</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #191b20;
      --text: #f4f5f7;
      --muted: #a8adb7;
      --line: #343840;
      --accent: #f0f0f0;
      --accent-text: #111216;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(900px, 92vw);
      margin: 0 auto;
      padding: 56px 0 72px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 7vw, 4.5rem);
      letter-spacing: .04em;
    }

    .subtitle {
      margin: 0 0 36px;
      color: var(--muted);
    }

    .stage {
      display: grid;
      place-items: center;
      min-height: 320px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
    }

    #before {
      padding: 36px 20px;
    }

    #playerWrap {
      display: none;
      width: 100%;
    }

    #displayPlayer {
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    /* 再生リスト取得専用。画面外に隠す */
    #playlistLoaderWrap {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
      top: -9999px;
    }

    .main-button {
      min-width: min(360px, 80vw);
      padding: 20px 34px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-size: clamp(1.2rem, 4vw, 1.65rem);
      font-weight: 700;
      cursor: pointer;
    }

    .main-button:disabled {
      opacity: .45;
      cursor: wait;
    }

    .secondary {
      margin-top: 22px;
      padding: 12px 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    #againButton {
      display: none;
    }

    #status {
      min-height: 1.6em;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .small {
      margin-top: 28px;
      color: var(--muted);
      font-size: .8rem;
    }

    @media (max-width: 600px) {
      main { padding-top: 32px; }
      .stage { min-height: 240px; }
    }
  </style>
<script type="text/javascript" nonce="3a03b2d71a8f4e13bbb262530b6" src="//local.adguard.org?ts=1786718002811&amp;type=content-script&amp;dmn=chatgpt.com&amp;url=https%3A%2F%2Fchatgpt.com%2Fbackend-api%2Festuary%2Fcontent%3Fid%3Dfile_000000004c748206bbe24f76b20d3c56%26fn%3Dindex%25283%2529.html%26cd%3Dattachment%26ts%3D496311%26p%3Dfs%26cid%3D1%26sig%3D078d88a3554cc300727d6ec4150a5ff805bc3881a28b769548b459bfcee77d1f%26v%3D0&amp;app=msedge.exe&amp;css=2&amp;js=1&amp;rel=0&amp;rji=0&amp;sbe=1"></script><script type="text/javascript" nonce="3a03b2d71a8f4e13bbb262530b6" src="//local.adguard.org?ts=1786718002811&amp;name=AdGuard%20Extra&amp;name=AdGuard%20Popup%20Blocker&amp;type=user-script"></script></head>

<body>
  <main>
    <h1>剣持じゃんけん</h1>
    <p class="subtitle">何が出るかは、押してからのお楽しみ。</p>

    <section class="stage">
      <div id="before">
        <button id="jankenButton" class="main-button" type="button" disabled>
          読み込み中…
        </button>

        <p id="status" aria-live="polite">
          YouTubeプレイリストを準備しています。
        </p>
      </div>

      <div id="playerWrap">
        <div id="displayPlayer"></div>
      </div>
    </section>

    <button id="againButton" class="secondary" type="button">
      もう一回
    </button>

    <p class="small">テスト版</p>
  </main>

  <!-- 再生リスト取得専用の非表示プレイヤー -->
  <div id="playlistLoaderWrap" aria-hidden="true">
    <div id="playlistLoader"></div>
  </div>

  <script>
    const PLAYLIST_ID = "PLGQedG8B-hiE";

    let playlistLoader;
    let displayPlayer;

    let videoIds = [];
    let lastIndex = -1;

    const jankenButton = document.getElementById("jankenButton");
    const againButton = document.getElementById("againButton");
    const before = document.getElementById("before");
    const playerWrap = document.getElementById("playerWrap");
    const status = document.getElementById("status");

    // YouTube IFrame Player API
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      // 1) 再生リスト取得専用プレイヤー
      playlistLoader = new YT.Player("playlistLoader", {
        width: "1",
        height: "1",
        playerVars: {
          autoplay: 0,
          controls: 0,
          playsinline: 1
        },
        events: {
          onReady: onPlaylistLoaderReady,
          onError: onPlaylistLoaderError
        }
      });

      // 2) 実際の表示・再生専用プレイヤー
      displayPlayer = new YT.Player("displayPlayer", {
        width: "100%",
        height: "100%",
        playerVars: {
          autoplay: 0,
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: onDisplayPlayerReady,
          onStateChange: onDisplayPlayerStateChange,
          onError: onDisplayPlayerError
        }
      });
    };

    function onPlaylistLoaderReady() {
      // このプレイヤーでは再生しない。
      // 再生リストをcueしてID一覧だけ取得する。
      playlistLoader.cuePlaylist({
        listType: "playlist",
        list: PLAYLIST_ID,
        index: 0
      });

      waitForPlaylist();
    }

    function onDisplayPlayerReady() {
      // 表示用プレイヤーは空のまま待機。
    }

    function waitForPlaylist(attempt = 0) {
      const list = playlistLoader && playlistLoader.getPlaylist
        ? playlistLoader.getPlaylist()
        : [];

      if (Array.isArray(list) && list.length > 0) {
        videoIds = [...list];

        // 念のため取得後は非表示プレイヤーを停止。
        try {
          playlistLoader.stopVideo();
        } catch (e) {}

        jankenButton.disabled = false;
        jankenButton.textContent = "じゃんけんする";
        status.textContent = `${videoIds.length}本の動画を読み込みました。`;
        return;
      }

      if (attempt >= 40) {
        jankenButton.disabled = true;
        jankenButton.textContent = "読み込み失敗";
        status.textContent =
          "プレイリストを読み込めませんでした。公開設定・埋め込み設定・プレイリストIDを確認してください。";
        return;
      }

      setTimeout(() => waitForPlaylist(attempt + 1), 300);
    }

    function chooseRandomIndex(length) {
      if (length <= 1) return 0;

      let index;
      do {
        index = Math.floor(Math.random() * length);
      } while (index === lastIndex);

      lastIndex = index;
      return index;
    }

    function playRandomVideo() {
      if (!displayPlayer || videoIds.length === 0) return;

      const randomIndex = chooseRandomIndex(videoIds.length);
      const videoId = videoIds[randomIndex];

      before.style.display = "none";
      playerWrap.style.display = "block";
      againButton.style.display = "inline-block";

      status.textContent = "再生中です。";

      // 表示プレイヤーにはプレイリストを一度も読み込ませない。
      // 単体動画だけをロードして再生する。
      displayPlayer.loadVideoById({
        videoId: videoId
      });
    }

    function onDisplayPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        // 念のため明示的に停止。
        // 表示用プレイヤーにはplaylist contextがないため、
        // ここから次動画へ進むことはない。
        try {
          displayPlayer.stopVideo();
        } catch (e) {}

        status.textContent = "終了しました。「もう一回」で次を引けます。";
      }
    }

    function onPlaylistLoaderError(event) {
      console.error("Playlist loader error:", event.data);
      status.textContent =
        "プレイリストの読み込みでエラーが発生しました。";
    }

    function onDisplayPlayerError(event) {
      console.error("Display player error:", event.data);
      status.textContent =
        "この動画は埋め込み再生できない可能性があります。「もう一回」をお試しください。";
    }

    jankenButton.addEventListener("click", playRandomVideo);
    againButton.addEventListener("click", playRandomVideo);
  </script>
</body>
</html>
