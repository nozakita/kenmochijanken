<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>わっしょいパワー演出プレビュー</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101114;
    --panel: #191b20;
    --text: #f4f5f7;
    --muted: #a8adb7;
    --line: #343840;
    --lucky: #f4d35e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .mock-page {
    width: min(920px, 92vw);
    min-height: 620px;
    padding: 42px 24px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: #121419;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  h1 {
    margin: 0 0 24px;
    font-size: clamp(2rem, 7vw, 4rem);
  }

  .fake-panel {
    margin: 0 auto 18px;
    width: min(650px, 100%);
    height: 90px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
  }

  .fake-video {
    margin: 24px auto 0;
    width: min(760px, 100%);
    aspect-ratio: 16/9;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #050505;
  }

  .replay {
    margin-top: 22px;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }

  .wasshoi-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: grid;
    place-items: center;
    padding: 24px;
    pointer-events: none;
    background:
      radial-gradient(circle at center,
        rgba(244, 211, 94, .28) 0%,
        rgba(244, 211, 94, .08) 34%,
        rgba(0, 0, 0, .76) 72%);
  }

  .wasshoi-overlay[hidden] {
    display: none;
  }

  .wasshoi-overlay.show {
    animation: wasshoi-overlay-in 1.55s ease-out both;
  }

  .wasshoi-burst {
    position: relative;
    width: min(760px, 92vw);
    padding: 44px 24px;
    text-align: center;
    border: 2px solid var(--lucky);
    border-radius: 24px;
    background: rgba(16, 17, 20, .92);
    box-shadow:
      0 0 0 8px rgba(244, 211, 94, .08),
      0 0 48px rgba(244, 211, 94, .46),
      inset 0 0 38px rgba(244, 211, 94, .08);
    overflow: hidden;
  }

  .wasshoi-burst::before,
  .wasshoi-burst::after {
    content: "";
    position: absolute;
    inset: -55%;
    border: 2px solid rgba(244, 211, 94, .52);
    border-radius: 50%;
    animation: wasshoi-ring 1.25s ease-out both;
  }

  .wasshoi-burst::after {
    animation-delay: .16s;
  }

  .wasshoi-kicker {
    position: relative;
    z-index: 1;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: clamp(.9rem, 3vw, 1.15rem);
    font-weight: 800;
    letter-spacing: .18em;
  }

  .wasshoi-title {
    position: relative;
    z-index: 1;
    color: var(--lucky);
    font-size: clamp(2rem, 8vw, 5.2rem);
    font-weight: 900;
    line-height: 1.08;
    letter-spacing: .035em;
    text-shadow:
      0 0 12px rgba(244, 211, 94, .65),
      0 0 28px rgba(244, 211, 94, .35);
    animation: wasshoi-title-pop 1.1s cubic-bezier(.18, .85, .24, 1.25) both;
  }

  @keyframes wasshoi-overlay-in {
    0% { opacity: 0; }
    12% { opacity: 1; }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes wasshoi-title-pop {
    0% { opacity: 0; transform: scale(.55) rotate(-2deg); }
    38% { opacity: 1; transform: scale(1.12) rotate(1deg); }
    62% { transform: scale(.96) rotate(0deg); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes wasshoi-ring {
    0% { opacity: .8; transform: scale(.18); }
    100% { opacity: 0; transform: scale(1.05); }
  }

  @media (max-width: 650px) {
    .mock-page { min-height: 520px; }
    .wasshoi-burst { padding: 36px 18px; }
  }
</style>
<script type="text/javascript" nonce="8bdaf14e34104f6996aea6a2b56" src="//local.adguard.org?ts=1786964566095&amp;type=content-script&amp;dmn=chatgpt.com&amp;url=https%3A%2F%2Fchatgpt.com%2Fbackend-api%2Festuary%2Fcontent%3Fid%3Dfile_000000002ae081fd9972ed16e5acbde7%26fn%3Dwasshoi_power_preview.html%26cd%3Dattachment%26ts%3D496379%26p%3Dfs%26cid%3D1%26sig%3Dc02c790f4080df9b6ceba7d5bf8a2ef9acf6deade5ba5a466f0944019aece63e%26v%3D0&amp;app=msedge.exe&amp;css=2&amp;js=1&amp;rel=0&amp;rji=0&amp;sbe=1"></script></head>
<body>

<div class="mock-page">
  <h1>剣持じゃんけん</h1>
  <div class="fake-panel"></div>
  <div class="fake-panel"></div>
  <div class="fake-video"></div>
  <button class="replay" type="button" onclick="playWasshoi()">もう一度見る</button>
</div>

<div id="wasshoiOverlay" class="wasshoi-overlay" hidden aria-hidden="true">
  <div class="wasshoi-burst">
    <div class="wasshoi-kicker">2周目</div>
    <div class="wasshoi-title">わっしょいパワー発動！</div>
  </div>
</div>

<script>
  const overlay = document.getElementById("wasshoiOverlay");
  let timer = null;

  function playWasshoi() {
    clearTimeout(timer);
    overlay.hidden = false;
    overlay.classList.remove("show");

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        overlay.classList.add("show");
      });
    });

    timer = setTimeout(() => {
      overlay.hidden = true;
      overlay.classList.remove("show");
    }, 1550);
  }

  window.addEventListener("load", () => {
    setTimeout(playWasshoi, 400);
  });
</script>
</body>
</html>
